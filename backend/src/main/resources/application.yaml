server:
  port: 8080

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  v2:
    datasource:
      url: ${V2_DB_URL:jdbc:mysql://localhost:3306/examinsight_v2?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${V2_DB_USERNAME:${DB_USERNAME:root}}
      password: ${V2_DB_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: com.mysql.cj.jdbc.Driver
    storage:
      mode: ${V2_STORAGE_MODE:local}
      bucket-key: ${V2_STORAGE_BUCKET:local-private}
      # Public deployments should set a storage-only secret. Local development may
      # temporarily inherit AUTH_HASH_SECRET so no plaintext object key reaches MySQL.
      key-secret: ${V2_STORAGE_KEY_SECRET:${app.auth.hash-secret:}}
      part-size: 8388608
      upload-session-ttl: PT24H
      max-concurrent-uploads: 3
      local:
        root: ${V2_LOCAL_STORAGE_ROOT:./data/v2-storage}
    processing:
      enabled: ${V2_ASSET_PROCESSING_ENABLED:true}
      poll-interval: ${V2_ASSET_POLL_INTERVAL:PT2S}
      lease-duration: ${V2_ASSET_LEASE_DURATION:PT10M}
      batch-size: ${V2_ASSET_BATCH_SIZE:3}
      scanner:
        mode: ${V2_FILE_SCANNER_MODE:clamav}
        host: ${CLAMAV_HOST:localhost}
        port: ${CLAMAV_PORT:3310}
        connect-timeout: PT5S
        read-timeout: PT2M
        stream-chunk-size: 65536
      parser:
        key: tika-ocr
        version: 2026-08-10.2
        max-characters: 5000000
        target-tokens: 800
        overlap-tokens: 100
        max-tokens: 1800
      indexing:
        enabled: ${V2_VECTOR_INDEXING_ENABLED:true}
        provider: ${V2_EMBEDDING_PROVIDER:dashscope}
        provider-model: ${V2_EMBEDDING_PROVIDER_MODEL:qwen3.7-text-embedding}
        model-key: ${V2_EMBEDDING_MODEL_KEY:dashscope-qwen3.7-text-embedding-1024}
        embedding-version: ${V2_EMBEDDING_VERSION:dashscope-qwen3.7-text-embedding-1024-v1}
        index-name: ${V2_VECTOR_INDEX_NAME:examinsight-v2-chunks-qwen3.7-embedding-1024-v1}
        dimensions: ${V2_EMBEDDING_DIMENSIONS:1024}
        reconcile-batch-size: ${V2_INDEX_RECONCILE_BATCH_SIZE:200}
    retrieval:
      enabled: ${V2_RETRIEVAL_ENABLED:true}
      default-top-k: ${V2_RETRIEVAL_TOP_K:6}
      max-top-k: 12
      candidate-multiplier: 4
      min-semantic-score: ${V2_RETRIEVAL_MIN_SCORE:0.55}
      default-context-tokens: ${V2_RETRIEVAL_CONTEXT_TOKENS:3200}
      max-context-tokens: 8000
      max-chunks-per-asset: 3
      max-explicit-scope-items: ${V2_MAX_EXPLICIT_SCOPE_ITEMS:20}
      max-scoped-assets: 10000
      max-query-characters: 2000
  auth:
    hash-secret: ${AUTH_HASH_SECRET:}
    cookie:
      name: EXAMINSIGHT_SESSION
      csrf-name: XSRF-TOKEN
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: Lax
    human-verification:
      mode: ${HUMAN_VERIFICATION_MODE:disabled}
      verify-url: ${HUMAN_VERIFICATION_VERIFY_URL:}
      secret: ${HUMAN_VERIFICATION_SECRET:}
      scene-id: ${ALIYUN_CAPTCHA_SCENE_ID:}
      endpoint: ${ALIYUN_CAPTCHA_ENDPOINT:captcha.cn-shanghai.aliyuncs.com}
    mail:
      from: ${AUTH_MAIL_FROM:}
      from-name: ${AUTH_MAIL_FROM_NAME:ExamInsight}

spring:
  config:
    import: optional:file:./application-local.yml

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/LLM?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # V2 migrations deliberately use a separate schema while the legacy application
  # still reads from spring.datasource. Enable only after the empty V2 schema exists.
  flyway:
    enabled: ${V2_FLYWAY_ENABLED:false}
    url: ${V2_DB_URL:jdbc:mysql://localhost:3306/examinsight_v2?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true}
    user: ${V2_DB_USERNAME:${DB_USERNAME:root}}
    password: ${V2_DB_PASSWORD:${DB_PASSWORD:}}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
    validate-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Elasticsearch
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}

# 阿里云 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  openai-base-url: ${DASHSCOPE_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  native-base-url: ${DASHSCOPE_NATIVE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
  connect-timeout: PT15S
  request-timeout: PT2M
  chat:
    model: ${DASHSCOPE_CHAT_MODEL:qwen3.7-plus}
  vision:
    model: ${DASHSCOPE_VISION_MODEL:qwen3.7-plus}
  ocr:
    model: ${DASHSCOPE_OCR_MODEL:qwen3.5-ocr}
  image-generation:
    model: ${DASHSCOPE_IMAGE_MODEL:qwen-image-3.0}
  speech:
    model: ${DASHSCOPE_ASR_MODEL:qwen3-asr-flash}
  speech-synthesis:
    model: ${DASHSCOPE_TTS_MODEL:qwen3-tts-flash}
    voice: ${DASHSCOPE_TTS_VOICE:Cherry}
    language-type: ${DASHSCOPE_TTS_LANGUAGE:Chinese}
embedding:
  reindex-on-startup: ${EMBEDDING_REINDEX_ON_STARTUP:false}

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 文档上传路径
upload:
  path: ${UPLOAD_PATH:./data/uploads}

# 讯飞开放平台。真实密钥只从环境变量或被 Git 忽略的 application-local.yml 读取。
xfyun:
  app-id: ${XFYUN_APP_ID:}
  api-key: ${XFYUN_API_KEY:}
  api-secret: ${XFYUN_API_SECRET:}
  spark:
    api-password: ${XFYUN_SPARK_API_PASSWORD:}
    url: https://spark-api-open.xf-yun.com/x2/chat/completions
  image-generation:
    url: https://spark-api.cn-huabei-1.xf-yun.com/v2.1/tti
  image-understanding:
    url: wss://spark-api.cn-huabei-1.xf-yun.com/v2.1/image
  ocr:
    url: https://cbm01.cn-huabei-1.xf-yun.com/v1/private/se75ocrbm
  speech:
    url: wss://iat.xf-yun.com/v1
  ppt:
    base-url: https://zwapi.xfyun.cn/api/ppt/v2
  embedding:
    document-url: https://emb-cn-huabei-1.xf-yun.com/
    query-url: https://emb-cn-huabei-1.xf-yun.com/
    dimensions: ${LEGACY_XFYUN_EMBEDDING_DIMENSIONS:2560}

# RAG 配置
rag:
  chunk-size: 500
  chunk-overlap: 100
  top-k: 5
  min-score: 0.6

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
