server:
  port: 8080

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  v2:
    datasource:
      url: ${V2_DB_URL:jdbc:mysql://localhost:3306/examinsight_v2?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${V2_DB_USERNAME:${DB_USERNAME:root}}
      password: ${V2_DB_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: com.mysql.cj.jdbc.Driver
  auth:
    hash-secret: ${AUTH_HASH_SECRET:}
    cookie:
      name: EXAMINSIGHT_SESSION
      csrf-name: XSRF-TOKEN
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: Lax
    human-verification:
      mode: ${HUMAN_VERIFICATION_MODE:disabled}
      verify-url: ${HUMAN_VERIFICATION_VERIFY_URL:}
      secret: ${HUMAN_VERIFICATION_SECRET:}
      scene-id: ${ALIYUN_CAPTCHA_SCENE_ID:}
      endpoint: ${ALIYUN_CAPTCHA_ENDPOINT:captcha.cn-shanghai.aliyuncs.com}
    mail:
      from: ${AUTH_MAIL_FROM:}
      from-name: ${AUTH_MAIL_FROM_NAME:ExamInsight}

spring:
  config:
    import: optional:file:./application-local.yml

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/LLM?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # V2 migrations deliberately use a separate schema while the legacy application
  # still reads from spring.datasource. Enable only after the empty V2 schema exists.
  flyway:
    enabled: ${V2_FLYWAY_ENABLED:false}
    url: ${V2_DB_URL:jdbc:mysql://localhost:3306/examinsight_v2?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true}
    user: ${V2_DB_USERNAME:${DB_USERNAME:root}}
    password: ${V2_DB_PASSWORD:${DB_PASSWORD:}}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
    validate-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Elasticsearch
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}

# 阿里云 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  chat:
    model: qwen-plus-2025-07-28
    temperature: 0.7
    max-tokens: 2000
embedding:
  reindex-on-startup: ${EMBEDDING_REINDEX_ON_STARTUP:false}

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 文档上传路径
upload:
  path: ${UPLOAD_PATH:./data/uploads}

# 讯飞开放平台。真实密钥只从环境变量或被 Git 忽略的 application-local.yml 读取。
xfyun:
  app-id: ${XFYUN_APP_ID:}
  api-key: ${XFYUN_API_KEY:}
  api-secret: ${XFYUN_API_SECRET:}
  spark:
    api-password: ${XFYUN_SPARK_API_PASSWORD:}
    url: https://spark-api-open.xf-yun.com/x2/chat/completions
  image-generation:
    url: https://spark-api.cn-huabei-1.xf-yun.com/v2.1/tti
  image-understanding:
    url: wss://spark-api.cn-huabei-1.xf-yun.com/v2.1/image
  ocr:
    url: https://cbm01.cn-huabei-1.xf-yun.com/v1/private/se75ocrbm
  speech:
    url: wss://iat.xf-yun.com/v1
  ppt:
    base-url: https://zwapi.xfyun.cn/api/ppt/v2
  embedding:
    document-url: https://emb-cn-huabei-1.xf-yun.com/
    query-url: https://emb-cn-huabei-1.xf-yun.com/
    dimensions: 2048

# RAG 配置
rag:
  chunk-size: 500
  chunk-overlap: 100
  top-k: 5
  min-score: 0.6

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
