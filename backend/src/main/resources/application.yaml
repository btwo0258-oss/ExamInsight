server:
  port: 8080

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    secret: ${JWT_SECRET:}

spring:
  config:
    import: optional:file:./application-local.yml

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/LLM?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Elasticsearch
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}

# 阿里云 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  chat:
    model: qwen-plus-2025-07-28
    temperature: 0.7
    max-tokens: 2000
  embedding:
    model: text-embedding-v1

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 文档上传路径
upload:
  path: ${UPLOAD_PATH:./data/uploads}

# 讯飞开放平台。真实密钥只从环境变量或被 Git 忽略的 application-local.yml 读取。
xfyun:
  app-id: ${XFYUN_APP_ID:}
  api-key: ${XFYUN_API_KEY:}
  api-secret: ${XFYUN_API_SECRET:}
  spark:
    api-password: ${XFYUN_SPARK_API_PASSWORD:}
    url: https://spark-api-open.xf-yun.com/x2/chat/completions
  image-generation:
    url: https://spark-api.cn-huabei-1.xf-yun.com/v2.1/tti
  image-understanding:
    url: wss://spark-api.cn-huabei-1.xf-yun.com/v2.1/image
  ocr:
    url: https://cbm01.cn-huabei-1.xf-yun.com/v1/private/se75ocrbm
  speech:
    url: wss://iat.xf-yun.com/v1
  ppt:
    base-url: https://zwapi.xfyun.cn/api/ppt/v2

# RAG 配置
rag:
  chunk-size: 500
  chunk-overlap: 100
  top-k: 5
  min-score: 0.6

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
