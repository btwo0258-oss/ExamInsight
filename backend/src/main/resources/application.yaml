server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/LLM?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 2021921
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Elasticsearch
elasticsearch:
  host: localhost
  port: 9200

# 阿里云 DashScope 配置
dashscope:
  api-key: sk-06833190552c4dd8af261537b591352b
  chat:
    model: qwen-plus-2025-07-28
    temperature: 0.7
    max-tokens: 2000
  embedding:
    model: text-embedding-v1

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 文档上传路径
upload:
  path: D:/KnowledgeQA/uploads

# RAG 配置
rag:
  chunk-size: 500
  chunk-overlap: 100
  top-k: 5
  min-score: 0.6

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn